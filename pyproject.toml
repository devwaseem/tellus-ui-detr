[project]
name = "tellus"
version = "0.1.0"
description = "Parallel structured UI generation with a decoder-only language backbone"
readme = "README.md"
authors = [
    { name = "Waseem Akram", email = "waseem07799@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[project.scripts]
tellus = "tellus.cli:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
